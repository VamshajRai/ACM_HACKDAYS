<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustScan // signal intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5edc9; --paper-deep:#e9dda9; --ink:#172621; --muted:#66716a; --line:#1d2b25; --orange:#d95135; --green:#188d82; --mint:#c6e1cd; --yellow:#f4cb58; --cream:#fffbea; --shadow:4px 4px 0 var(--line); }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body { margin:0; color:var(--ink); font-family:"DM Mono",monospace; background-color:var(--paper); background-image:radial-gradient(rgba(23,38,33,.17) .7px,transparent .7px); background-size:7px 7px; }
  button,textarea,input { font:inherit; } button { cursor:pointer; } a { color:var(--green); }
  .shell { width:min(100% - 34px,990px); margin:0 auto; padding-bottom:34px; }
  .topbar { border-bottom:1px solid rgba(29,43,37,.45); height:39px; display:flex; align-items:center; justify-content:space-between; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; } .brand-mark { width:16px; height:16px; border:2px solid var(--line); background:var(--orange); display:grid; place-items:center; font-size:8px; }
  .live { color:var(--green); } .live::before { content:""; display:inline-block; width:5px; height:5px; background:var(--green); margin-right:7px; vertical-align:1px; }
  .eyebrow { margin:30px 0 9px; color:var(--orange); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  .hero { max-width:730px; } h1,h2,h3,p { margin-top:0; }
  h1 { max-width:700px; margin-bottom:12px; font-family:"Space Mono",monospace; font-size:clamp(35px,7vw,70px); line-height:.9; letter-spacing:-.06em; text-transform:uppercase; }
  h1 span { color:var(--orange); display:block; } .lede { max-width:430px; font-size:12px; line-height:1.65; color:var(--muted); }
  .steps { display:flex; margin:27px 0 17px; border:2px solid var(--line); box-shadow:var(--shadow); background:var(--cream); max-width:650px; }
  .step { flex:1; padding:10px 12px; font-size:9px; border-right:1px solid var(--line); text-transform:uppercase; } .step:last-child { border:0; }
  .step b { display:inline-grid; place-items:center; width:18px; height:18px; border:1px solid var(--orange); color:var(--orange); margin-right:7px; font-size:9px; }
  .section-label { color:var(--orange); font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin:22px 0 6px; } .section-label span { color:var(--muted); }
  .section-label .ghost { float:right; margin-top:-7px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:12px; align-items:start; }
  .panel { border:2px solid var(--line); background:rgba(255,251,234,.75); box-shadow:var(--shadow); }
  .panel-head { display:flex; align-items:center; justify-content:space-between; padding:10px 13px 0; } .panel-title { font-family:"Space Mono",monospace; font-size:12px; text-transform:uppercase; letter-spacing:.02em; }
  .panel-body { padding:12px; }
  .input-panel textarea { display:block; width:100%; min-height:132px; padding:12px; resize:vertical; color:var(--ink); background:var(--cream); border:2px solid var(--line); outline:none; font-size:12px; line-height:1.6; }
  .input-panel textarea:focus { box-shadow:inset 0 0 0 2px var(--yellow); }
  .drop-zone { min-height:132px; margin-top:10px; padding:16px; border:2px dashed var(--line); background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; transition:background .15s,border-color .15s; }
  .drop-zone.is-dragging { border-color:var(--green); background:var(--mint); }
  .drop-zone.is-disabled { opacity:.55; }
  .drop-zone input { display:none; }
  .file-label { color:var(--ink); font-size:11px; font-weight:700; text-decoration:underline; cursor:pointer; }
  .file-help { color:var(--muted); font-size:9px; margin:0; }
  .file-label.is-disabled { cursor:not-allowed; text-decoration:none; }
  .input-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; }
  .input-actions .primary { margin-left:auto; }
  .primary,.ghost { border:2px solid var(--line); padding:9px 13px; color:var(--cream); background:var(--orange); box-shadow:2px 2px 0 var(--line); font-size:10px; text-transform:uppercase; font-weight:700; }
  .primary:hover,.ghost:hover { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--line); } .primary:disabled { cursor:wait; opacity:.6; }
  .ghost { color:var(--ink); background:var(--cream); box-shadow:none; font-size:9px; padding:6px 9px; }
  .aside { background:var(--mint); padding:14px; min-height:150px; } .aside h3 { color:var(--orange); font-size:9px; text-transform:uppercase; margin-bottom:14px; }
  .aside p { font-size:10px; line-height:1.6; border-top:1px dashed var(--line); padding:9px 0 0; margin:9px 0 0; } .aside p b { color:var(--orange); }
  .status { color:var(--orange); font-size:10px; min-height:15px; margin:8px 0 0; } .error { color:var(--orange); }
  .result { margin-top:27px; animation:reveal .45s ease both; } @keyframes reveal { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .score-panel { padding:14px 16px; display:grid; grid-template-columns:95px minmax(0,1fr); gap:16px; align-items:center; }
  .score { font-family:"Space Mono",monospace; color:var(--green); font-size:39px; line-height:1; } .score small { color:var(--muted); font:10px "DM Mono",monospace; }
  .verdict { font-family:"Space Mono",monospace; font-size:14px; text-transform:uppercase; margin-bottom:9px; } .confidence { font-family:"DM Mono",monospace; font-size:9px; color:var(--muted); margin-left:8px; }
  .meter { height:12px; border:1px solid var(--line); background:var(--paper-deep); } .meter-fill { height:100%; transition:width .6s ease; }
  .score-details { min-width:0; } .summary { font-size:10px; line-height:1.6; margin:10px 0 0; } .disclaimer { grid-column:2 / -1; color:var(--muted); font-size:9px; margin:0; }
  .result-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; } .result-grid .wide { grid-column:1 / -1; } .result-grid .panel-body { padding-top:8px; }
  .flag { border-top:1px dashed var(--line); padding:9px 0 4px; font-size:10px; line-height:1.5; } .flag:first-child { border-top:0; } .flag-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:3px; text-transform:uppercase; font-size:9px; } .flag-head span:last-child { color:var(--orange); }
  .clean { color:var(--green); font-size:10px; padding:8px; background:var(--mint); } ul { margin:0; padding-left:20px; } li { margin:7px 0; font-size:10px; line-height:1.5; }
  .provenance { font-size:10px; line-height:1.6; margin-bottom:10px; } .chat-log { max-height:190px; overflow:auto; margin-bottom:10px; }
  .message { max-width:83%; border:1px solid var(--line); padding:8px 10px; font-size:10px; line-height:1.5; margin:6px 0; white-space:pre-wrap; } .message.user { margin-left:auto; background:var(--yellow); } .message.model { background:var(--cream); }
  .chat-form { display:flex; gap:8px; } .chat-form input { min-width:0; flex:1; border:2px solid var(--line); background:var(--cream); padding:9px; color:var(--ink); font-size:10px; } .chat-form button { border:2px solid var(--line); background:var(--green); color:var(--cream); padding:0 13px; font-weight:700; }
  .chat-float { position:fixed; right:22px; bottom:42px; z-index:1000; display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
  .chat-launcher { border:2px solid var(--line); padding:12px 17px; background:var(--green); color:var(--cream); box-shadow:3px 3px 0 var(--line); font-size:11px; font-weight:700; text-transform:uppercase; }
  .chat-launcher:hover { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--line); }
  .chat-dialog { width:min(480px,calc(100vw - 32px)); height:min(640px,calc(100vh - 112px)); min-height:320px; overflow:hidden; background:var(--paper); display:flex; flex-direction:column; }
  .chat-dialog.is-expanded { position:fixed; inset:16px; z-index:1001; width:auto; height:auto; min-height:0; max-height:none; }
  .chat-dialog .panel-head { padding:10px 12px; border-bottom:1px solid var(--line); flex:none; }
  .chat-dialog .panel-body { padding:10px; display:flex; flex:1; flex-direction:column; min-height:0; }
  .chat-log { flex:1; min-height:0; max-height:none; overflow:auto; margin-bottom:10px; }
  .chat-tools { display:flex; align-items:center; gap:8px; }
  .chat-expand { border:1px solid var(--line); background:var(--cream); color:var(--ink); padding:5px 8px; font-size:9px; text-transform:uppercase; }
  .chat-close { border:0; background:none; color:var(--orange); padding:0 0 0 8px; font-size:13px; line-height:1; }
  .support { margin-top:34px; } .support-copy { color:var(--muted); font-size:10px; line-height:1.6; max-width:650px; }
  .support-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }
  .support-card { min-height:170px; padding:12px; border:2px solid var(--line); background:rgba(255,251,234,.75); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:space-between; }
  .support-card:first-child { border-top:3px solid var(--orange); } .support-card:last-child { background:var(--mint); }
  .support-card h3 { font-family:"Space Mono",monospace; font-size:11px; text-transform:uppercase; margin-bottom:8px; } .support-card p { font-size:10px; line-height:1.55; color:var(--muted); }
  .support-link { align-self:flex-start; border:2px solid var(--line); padding:8px 10px; background:var(--ink); color:var(--cream); font-size:9px; font-weight:700; text-decoration:none; }
  .protocol { margin-top:14px; padding:13px; } .protocol-head { display:flex; justify-content:space-between; gap:12px; align-items:center; } .protocol-head span { color:var(--muted); font-size:9px; text-transform:uppercase; }
  .protocol-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin-top:10px; }
  .protocol-step { border:1px solid rgba(29,43,37,.6); padding:10px; min-height:85px; background:rgba(233,221,169,.35); } .protocol-step b { display:block; color:var(--orange); font-size:9px; margin-bottom:8px; } .protocol-step p { font-size:9px; line-height:1.45; margin:0; }
  footer { border-top:1px solid var(--line); margin-top:25px; padding-top:9px; color:var(--muted); font-size:8px; display:flex; justify-content:space-between; gap:12px; }
  @media (max-width:700px) { .shell { width:min(100% - 22px,600px); } .topbar { font-size:8px; } .topbar .live { font-size:0; } .topbar .live::after { content:"LIVE"; font-size:8px; } .steps { overflow:hidden; } .step { padding:8px 7px; font-size:7px; } .step b { width:15px; height:15px; margin-right:3px; } .layout,.result-grid,.support-grid,.protocol-grid { grid-template-columns:1fr; } .score-panel { grid-template-columns:76px 1fr; gap:12px; } .summary { grid-column:1 / -1; } .disclaimer { grid-column:1 / -1; } .result-grid .wide { grid-column:auto; } .input-actions { align-items:flex-end; flex-direction:column; } .file-label { align-self:flex-start; } .primary { width:100%; } .protocol-head { align-items:flex-start; flex-direction:column; } footer { flex-direction:column; } .chat-float { right:14px; bottom:24px; } .chat-dialog { width:min(460px,calc(100vw - 28px)); height:min(72vh,620px); min-height:280px; } .chat-dialog.is-expanded { inset:8px; width:auto; height:auto; min-height:0; } }
  @media (max-width:700px) { .chat-dialog:not(.is-expanded) { width:min(460px,calc(100vw - 44px)); } }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

function scoreColor(score) {
  return score < 35 ? '#188d82' : score < 65 ? '#c58c13' : '#d95135';
}

async function responseError(response) {
  try {
    const data = await response.json();
    return typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
  } catch {
    return `Error ${response.status}`;
  }
}

function Header() {
  return (
    <header className="topbar">
      <div className="brand"><span className="brand-mark">T</span> TrustScan</div>
      <div className="live">Live analysis engine &nbsp;|&nbsp; v0.1</div>
    </header>
  );
}

function Intake({ onScan, busy, status }) {
  const [text, setText] = useState('');
  const [file, setFile] = useState(null);
  const [isDragging, setIsDragging] = useState(false);
  const [fileError, setFileError] = useState('');
  const hasText = Boolean(text.trim());
  const acceptedTypes = ['image/png', 'image/jpeg', 'image/webp', 'audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/mp4'];

  const chooseFile = candidate => {
    setFileError('');
    if (!candidate) return;
    if (!acceptedTypes.includes(candidate.type)) {
      setFileError('Choose a PNG, JPG, WebP, MP3, WAV, OGG, or MP4 file.');
      return;
    }
    setFile(candidate);
    setText('');
  };

  const handleDrop = event => {
    event.preventDefault();
    setIsDragging(false);
    if (hasText) {
      setFileError('Clear the text before adding a file.');
      return;
    }
    chooseFile(event.dataTransfer.files[0]);
  };

  const submit = event => { event.preventDefault(); onScan(text, file); };
  return (
    <>
      <div className="section-label">01 / inspect <span>Bring us a signal</span></div>
      <div className="layout">
        <form className="panel input-panel" onSubmit={submit}>
          <div className="panel-head">
            <div className="panel-title">Bring us a signal</div>
            <span className="live">Ready for input</span>
          </div>
          <div className="panel-body">
            <textarea
              value={text}
              disabled={Boolean(file) || busy}
              onChange={event => { setText(event.target.value); setFileError(''); }}
              placeholder={file ? 'Remove the selected file to enter text instead.' : 'Paste a message or URL in any language...'}
            />
            <div
              className={`drop-zone ${isDragging ? 'is-dragging' : ''} ${hasText || busy ? 'is-disabled' : ''}`}
              onDragOver={event => { event.preventDefault(); if (!hasText && !busy) setIsDragging(true); }}
              onDragLeave={event => { if (!event.currentTarget.contains(event.relatedTarget)) setIsDragging(false); }}
              onDrop={handleDrop}
            >
              <input
                id="signal-file"
                type="file"
                accept="image/png,image/jpeg,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/mp4"
                disabled={hasText || busy}
                onChange={event => chooseFile(event.target.files[0] || null)}
              />
              {file ? (
                <>
                  <strong>{file.name}</strong>
                  <p className="file-help">File ready for analysis</p>
                  <button type="button" className="ghost" onClick={() => { setFile(null); setFileError(''); }}>Remove file</button>
                </>
              ) : (
                <>
                  <label className={`file-label ${hasText || busy ? 'is-disabled' : ''}`} htmlFor="signal-file">
                    {hasText ? 'Clear the message to upload a file' : isDragging ? 'Drop file to attach' : 'Drop an image or audio file here'}
                  </label>
                  {!hasText && <p className="file-help">or click to browse · PNG, JPG, WebP, WAV, MP3, OGG, MP4</p>}
                </>
              )}
            </div>
            <div className="input-actions">
              {hasText && <button type="button" className="ghost" onClick={() => { setText(''); setFileError(''); }}>Clear text</button>}
              <button className="primary" disabled={busy}>{busy ? 'Analyzing...' : 'Run analysis  ->'}</button>
            </div>
            <div className={`status ${status.error || fileError ? 'error' : ''}`}>{fileError || status.message}</div>
          </div>
        </form>
        <aside className="panel aside">
          <h3>The TrustScan lens</h3>
          <p><b>01</b> Language &amp; intent</p>
          <p><b>02</b> Visual &amp; contextual cues</p>
          <p><b>03</b> Origin &amp; claims</p>
        </aside>
      </div>
    </>
  );
}

function ScoreCard({ analysis, onReset }) {
  const color = scoreColor(analysis.trust_score);
  return (
    <>
      <div className="section-label">02 / readout <span>Signal report</span><button className="ghost" onClick={onReset}>New scan</button></div>
      <section className="panel score-panel">
        <div className="score" style={{ color }}>{analysis.trust_score}<small> suspicion / 100</small></div>
        <div className="score-details">
          <div className="verdict">
            {analysis.verdict}
            {analysis.confidence && <span className="confidence">confidence: {analysis.confidence}</span>}
          </div>
          <div className="meter"><div className="meter-fill" style={{ width: `${analysis.trust_score}%`, background: color }} /></div>
          <p className="summary" style={{ color }}>{analysis.summary}</p>
        </div>
        <p className="disclaimer">Score is a risk assessment, not proof of truth.</p>
      </section>
    </>
  );
}

function Chat({ scan }) {
  const [question, setQuestion] = useState('');
  const [history, setHistory] = useState([]);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);
  const [expanded, setExpanded] = useState(false);

  const ask = async event => {
    event.preventDefault();
    const trimmed = question.trim();
    if (!trimmed || busy || !scan) return;
    setQuestion('');
    setBusy(true);
    const next = [...history, { role: 'user', text: trimmed }];
    setHistory(next);
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: trimmed, scan, history })
      });
      if (!response.ok) throw new Error(await responseError(response));
      const data = await response.json();
      setHistory([...next, { role: 'model', text: data.answer }]);
    } catch (error) {
      setHistory([...next, { role: 'model', text: `Chat failed: ${error.message}` }]);
    }
    setBusy(false);
  };

  return (
    <div className="chat-float">
      <button className="chat-launcher" onClick={() => setOpen(!open)} aria-expanded={open} aria-controls="ai-chat-dialog">
        {open ? 'Close TrustScan AI' : 'Ask TrustScan AI  ->'}
      </button>
      {open && (
        <section className={`panel chat-dialog ${expanded ? 'is-expanded' : ''}`} id="ai-chat-dialog" role="dialog" aria-label="Ask TrustScan AI">
          <div className="panel-head">
            <div className="panel-title">TrustScan AI</div>
            <div className="chat-tools">
              <button className="chat-expand" onClick={() => setExpanded(!expanded)} aria-label={expanded ? 'Restore chat size' : 'Expand chat'}>
                {expanded ? 'Restore' : 'Expand'}
              </button>
              <button className="chat-close" onClick={() => { setOpen(false); setExpanded(false); }} aria-label="Close AI chat">x</button>
            </div>
          </div>
          <div className="panel-body">
            <div className="chat-log">
              {history.length
                ? history.map((message, index) => (
                    <div className={`message ${message.role === 'user' ? 'user' : 'model'}`} key={index}>{message.text}</div>
                  ))
                : <div className="clean">{scan ? 'Make sense of this report with a follow-up question.' : 'Run a scan first to ask about a report.'}</div>}
            </div>
            <form className="chat-form" onSubmit={ask}>
              <input value={question} disabled={!scan || busy} onChange={event => setQuestion(event.target.value)} placeholder={scan ? 'Why was this flagged?' : 'Waiting for a scan...'} />
              <button disabled={!scan || busy}>{busy ? '...' : 'Ask'}</button>
            </form>
          </div>
        </section>
      )}
    </div>
  );
}

function Report({ scan, onReset }) {
  const { analysis, provenance } = scan;
  const legit = analysis.legit_signals || [];
  const verify = analysis.verify_yourself || [];
  return (
    <div className="result">
      <ScoreCard analysis={analysis} onReset={onReset} />
      <div className="result-grid">
        <section className="panel">
          <div className="panel-head"><div className="panel-title">Red flags</div><span>{analysis.red_flags.length ? `${analysis.red_flags.length} found` : 'Clear'}</span></div>
          <div className="panel-body">
            {analysis.red_flags.length
              ? analysis.red_flags.map((flag, index) => (
                  <div className="flag" key={`${flag.category}-${index}`}>
                    <div className="flag-head"><span>{flag.category}</span><span>{flag.severity}</span></div>
                    {flag.detail}
                  </div>
                ))
              : <div className="clean">No red flags found.</div>}
          </div>
        </section>

        <section className="panel">
          <div className="panel-head"><div className="panel-title">Looks genuine</div><span>{legit.length ? `${legit.length} found` : 'None'}</span></div>
          <div className="panel-body">
            <ul>{legit.length ? legit.map((item, index) => <li key={index}>{item}</li>) : <li>No clear genuine signals found.</li>}</ul>
          </div>
        </section>

        <section className="panel">
          <div className="panel-head"><div className="panel-title">Open questions</div><span>Verify</span></div>
          <div className="panel-body">
            <ul>{analysis.claims_to_verify.length ? analysis.claims_to_verify.map((claim, index) => <li key={index}>{claim}</li>) : <li>No specific claims were extracted.</li>}</ul>
          </div>
        </section>

        <section className="panel wide">
          <div className="panel-head"><div className="panel-title">Check it yourself</div><span>Do this first</span></div>
          <div className="panel-body">
            <ul>{verify.length ? verify.map((item, index) => <li key={index}>{item}</li>) : <li>No extra checks suggested.</li>}</ul>
          </div>
        </section>

        <section className="panel wide">
          <div className="panel-head"><div className="panel-title">Origin trail</div><span>What we found</span></div>
          <div className="panel-body">
            <p className="provenance">{provenance ? provenance.summary : 'Origin check unavailable for this scan.'}</p>
            {provenance?.sources?.length > 0 && (
              <ul>{provenance.sources.map(source => <li key={source.url}><a href={source.url} target="_blank" rel="noreferrer">{source.title}</a></li>)}</ul>
            )}
          </div>
        </section>
      </div>
      <SupportSections />
    </div>
  );
}

function SupportSections() {
  return (
    <>
      <section className="support">
        <div className="section-label">03 / escalation &amp; crisis support <span>Immediate action</span></div>
        <h2 className="panel-title">Critical threat or emergency dispatch</h2>
        <p className="support-copy">If you or someone else is facing immediate physical danger, extortion, or severe exploitation, do not wait for AI analysis. Escalate immediately to verified law enforcement and emergency response channels.</p>
        <div className="support-grid">
          <article className="support-card">
            <div><h3>Report financial fraud</h3><p>Preserve the original message, transaction details, and account identifiers before reporting. You can also call the national cybercrime helpline, 1930.</p></div>
            <a className="support-link" href="https://www.cybercrime.gov.in/" target="_blank" rel="noreferrer">Open cybercrime portal -&gt;</a>
          </article>
          <article className="support-card">
            <div><h3>Immediate danger</h3><p>Contact your local emergency number when there is a direct threat to life, safety, or physical wellbeing.</p></div>
            <a className="support-link" href="tel:112">Call emergency services (112) -&gt;</a>
          </article>
          <article className="support-card">
            <div><h3>Mental health crisis</h3><p>In India, Tele-MANAS provides 24/7 mental-health support for urgent emotional distress.</p></div>
            <a className="support-link" href="tel:14416">Call Tele-MANAS (14416) -&gt;</a>
          </article>
        </div>
      </section>

      <section className="panel protocol">
        <div className="protocol-head">
          <div>
            <div className="section-label">Evidence advisory <span>(not legal advice)</span></div>
            <div className="panel-title">Evidence preservation protocol</div>
          </div>
          <span>Keep everything</span>
        </div>
        <div className="protocol-grid">
          <div className="protocol-step"><b>Step 01</b><p>Do not delete WhatsApp, Telegram chats, SMS, or audio notes. Take timestamped screen captures.</p></div>
          <div className="protocol-step"><b>Step 02</b><p>Preserve raw email headers, UPI transaction IDs, bank statements, APK installers, or originating phone numbers.</p></div>
          <div className="protocol-step"><b>Step 03</b><p>Stop communicating with extortionists; do not transfer money, negotiate, or confront scammers alone.</p></div>
          <div className="protocol-step"><b>Step 04</b><p>Save a screenshot of this TrustScan report to share with the Police or Cyber Cell along with your other evidence.</p></div>
        </div>
      </section>
    </>
  );
}

function App() {
  const [scan, setScan] = useState(null);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState({ message: '', error: false });

  const runScan = async (text, file) => {
    if (!text.trim() && !file) { setStatus({ message: 'Add text or a file first.', error: true }); return; }
    const formData = new FormData();
    if (text.trim()) formData.append('text', text.trim());
    if (file) formData.append('file', file);
    setBusy(true);
    setStatus({ message: 'Signal received. Running analysis...', error: false });
    try {
      const response = await fetch('/api/scan', { method: 'POST', body: formData });
      if (!response.ok) throw new Error(await responseError(response));
      setScan(await response.json());
      setStatus({ message: '', error: false });
    } catch (error) {
      setStatus({ message: `Scan failed: ${error.message}`, error: true });
    }
    setBusy(false);
  };

  return (
    <div className="shell">
      <Header />
      <main>
        <div className="eyebrow">// signal intelligence for the real world</div>
        <section className="hero">
          <h1>Know what<br /><span>you're looking at.</span></h1>
          <p className="lede">Turn suspicious messages, claims, links, images, and audio into a clear, evidence-aware read in seconds.</p>
        </section>
        <nav className="steps">
          <div className="step"><b>01</b> Drop a signal</div>
          <div className="step"><b>02</b> Read the clues</div>
          <div className="step"><b>03</b> Ask better questions</div>
        </nav>
        <Intake onScan={runScan} busy={busy} status={status} />
        {scan && <Report scan={scan} onReset={() => setScan(null)} />}
      </main>
      <Chat scan={scan} />
      <footer>
        <span>TrustScan / human-first verification</span>
        <span>Assessment, not proof of truth.</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
